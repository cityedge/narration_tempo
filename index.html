<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-version" content="0.1.1" />
    <title>Narration Tempo v0.1.1</title>
    <style>
      :root {
  color-scheme: dark;
  font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
  background: #0c121c;
  color: #e4edf7;
  --accent: #59d5d8;
  --line: #2a394b;
  --muted: #9cacc0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
main {
  max-width: 1280px;
  margin: auto;
  padding: 22px 28px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
h1 {
  font-size: 28px;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--accent);
}
.app-name,
#appVersion {
  white-space: nowrap;
}
#appVersion {
  display: inline-block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  vertical-align: middle;
}
header p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 14px;
}
button,
input,
select {
  font: inherit;
}
button,
a {
  touch-action: manipulation;
}
button {
  border: 1px solid #40556d;
  border-radius: 6px;
  background: #1b2a3c;
  color: #e4edf7;
  min-height: 36px;
  padding: 6px 15px;
  cursor: pointer;
}
button:hover:not(:disabled) {
  border-color: var(--accent);
  background: #23384a;
}
button:disabled,
input:disabled,
select:disabled {
  opacity: 0.42;
  cursor: default;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
canvas:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
input,
select {
  background: #101c2a;
  color: #e4edf7;
  border: 1px solid #40556d;
  border-radius: 5px;
  padding: 7px 9px;
  min-width: 0;
}
input[type="number"] {
  width: 80px;
  font-variant-numeric: tabular-nums;
}
input[type="range"] {
  width: 100%;
  padding: 0;
  margin: 15px 0 4px;
  accent-color: var(--accent);
}
input[type="checkbox"] {
  width: 19px;
  height: 19px;
  accent-color: var(--accent);
  margin: 0;
}
input:invalid {
  border-color: #e6959e;
}
.languages {
  display: flex;
}
.languages button {
  border-radius: 0;
  font-size: 13px;
}
.languages button:first-child {
  border-radius: 6px 0 0 6px;
}
.languages button:last-child {
  border-radius: 0 6px 6px 0;
}
[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: #183440;
}
.intake-row {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 7fr);
  gap: 14px;
  margin-bottom: 14px;
}
.drop {
  width: 100%;
  min-height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 1px dashed #52718a;
  background: #141e2c;
  padding: 15px;
}
.drop svg {
  flex-shrink: 0;
}
.drop > span {
  min-width: 0;
}
.drop strong {
  display: block;
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.drop small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
  font-size: 12px;
}
.drop.drag {
  border-color: var(--accent);
  background: #203d49;
}
.wave-panel {
  border: 1px solid var(--line);
  background: #141e2c;
  border-radius: 7px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
h2 {
  font-size: 17px;
  margin: 0 0 14px;
  font-weight: 650;
}
.wave-panel h2 {
  margin: 0;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.legend {
  display: flex;
  gap: 24px;
  color: var(--muted);
  font-size: 12px;
}
.legend span:before {
  content: "";
  display: inline-block;
  width: 22px;
  height: 2px;
  background: #8a9aaf;
  vertical-align: middle;
  margin-right: 8px;
}
.legend .green:before {
  background: #54ce8b;
}
.legend .red:before {
  background: #ef777d;
}
canvas {
  touch-action: none;
  display: block;
  width: 100%;
  height: 145px;
  background: #101a27;
  border: 1px solid var(--line);
  margin-top: 10px;
  cursor: crosshair;
}
.transport {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
.transport button {
  font-size: 12px;
  white-space: nowrap;
  min-height: 32px;
  padding: 5px 12px;
}
.source-switch {
  display: flex;
}
.source-switch button:first-child {
  border-radius: 5px 0 0 5px;
}
.source-switch button:last-child {
  border-radius: 0 5px 5px 0;
}
#playTime {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#seek {
  flex: 1;
  width: 80px;
  min-width: 60px;
  margin: 0;
}
.tone-switches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: 10px 0 14px;
}
.tone-switches label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.tone-switches input {
  width: 16px;
  height: 16px;
}
#render {
  margin-top: 0;
  min-height: 38px;
  font-size: 14px;
}
#renderHint {
  margin-bottom: 12px;
}
.save {
  width: 100%;
  margin-top: 8px;
  min-height: 36px;
}
.time-axis {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.settings,
.output {
  min-width: 0;
  border: 1px solid var(--line);
  background: #141e2c;
  border-radius: 7px;
  padding: 16px 18px;
}
.check {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 14px;
}
.inline {
  display: flex;
  gap: 8px;
  align-items: center;
}
.range-labels {
  font-size: 11px;
  color: var(--muted);
}
#speed {
  font-size: 19px;
  width: 105px;
  font-weight: 600;
  text-align: center;
}
.target {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 18px;
  font-size: 13px;
}
.target input {
  width: 64px;
}
.durations {
  font-size: 12px;
  margin: 18px 0;
  color: var(--muted);
}
.durations strong {
  color: #e4edf7;
  margin-left: 10px;
  font-size: 15px;
}
.preview-row {
  font-size: 13px;
  margin-top: 8px;
}
.preview-row input {
  width: 76px;
}
.accent-outline {
  color: var(--accent);
  border-color: var(--accent);
  background: #19313e;
}
.ab {
  display: flex;
  margin: 16px 0 10px;
  border: 1px solid #40556d;
  border-radius: 6px;
  padding: 2px;
}
.ab button {
  flex: 1;
  border: 0;
  background: transparent;
  font-size: 13px;
  min-height: 30px;
}
.ab button[aria-pressed="true"] {
  background: var(--accent);
  color: #08222b;
}
audio {
  width: 100%;
  height: 38px;
}
.export-settings {
  border-top: 1px solid var(--line);
  padding-top: 14px;
  margin-top: 14px;
  font-size: 13px;
}
.primary {
  width: 100%;
  background: var(--accent);
  color: #08222b;
  border: 0;
  font-size: 16px;
  font-weight: 700;
  min-height: 44px;
  margin-top: 12px;
}
.primary:hover:not(:disabled) {
  background: #7ce6e6;
  color: #08222b;
}
.results {
  font-size: 11px;
  color: var(--muted);
  margin-top: 10px;
  flex-wrap: wrap;
}
a {
  color: var(--accent);
}
details {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  font-size: 13px;
}
summary {
  cursor: pointer;
  min-height: 24px;
}
.ws-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.ws-grid label {
  display: grid;
  gap: 4px;
  font-size: 11px;
}
.ws-grid input,
.ws-grid select {
  width: 100%;
}
.ws-grid button {
  font-size: 11px;
  align-self: end;
}
.status-panel {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px 16px;
  background: #141e2c;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.status-panel > .row {
  min-height: 26px;
}
#status {
  font-size: 12px;
  flex: 1;
  overflow-wrap: anywhere;
}
#status.error {
  color: #ff9b9f;
}
#percent {
  font-size: 11px;
  color: var(--muted);
}
progress {
  width: 100%;
  height: 5px;
  display: block;
  margin-top: 8px;
  accent-color: var(--accent);
}
.note {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
  margin: 7px 0 0;
}
[hidden] {
  display: none !important;
}
#cancel {
  min-height: 26px;
  padding: 2px 10px;
  color: #ffb3b3;
  font-size: 12px;
}
@media (min-width: 1000px) and (max-height: 800px) {
  main {
    padding-top: 14px;
  }
  canvas {
    height: 105px;
  }
  .drop {
    min-height: 72px;
  }
  header {
    margin-bottom: 12px;
  }
  .settings,
  .output {
    padding: 12px 16px;
  }
  .target {
    margin-top: 12px;
    padding-top: 12px;
  }
  .durations {
    margin: 12px 0;
  }
}
@media (max-width: 800px) {
  .intake-row {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .transport {
    flex-wrap: wrap;
    gap: 8px;
  }
  #seek {
    flex-basis: 100%;
  }
  main {
    padding: 16px;
  }
  .columns {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 23px;
  }
  .target,
  .preview-row {
    flex-wrap: wrap;
  }
  .inline {
    flex-wrap: wrap;
  }
  header p {
    font-size: 12px;
  }
  .languages button {
    padding: 5px 8px;
  }
  .wave-panel {
    padding: 12px;
  }
  .drop strong {
    font-size: 16px;
  }
  .legend {
    gap: 12px;
  }
  .time-axis #waveHint {
    font-size: 10px;
  }
  canvas {
    height: 125px;
  }
  .ws-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
/* Keep the primary workflow in a laptop viewport; details expand in place. */
@media (min-width: 801px) {
  main {
    padding-top: 18px;
    padding-bottom: 18px;
  }
  canvas {
    height: 130px;
  }
}
@media (min-width: 1000px) and (max-height: 800px) {
  main {
    padding: 10px 24px;
  }
  header {
    margin-bottom: 10px;
  }
  h1 {
    font-size: 25px;
  }
  .drop {
    min-height: 60px;
    padding: 10px;
  }
  .intake-row {
    gap: 10px;
    margin-bottom: 10px;
  }
  .wave-panel {
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  canvas {
    height: 68px;
  }
  .check {
    margin-bottom: 10px;
  }
  .target {
    padding-top: 10px;
    margin-top: 10px;
  }
  .durations {
    margin: 8px 0;
  }
  .settings,
  .output {
    padding: 12px 16px;
  }
  h2 {
    margin-bottom: 10px;
  }
  .ab {
    margin: 12px 0 8px;
  }
  .export-settings {
    margin-top: 10px;
    padding-top: 10px;
  }
  .transport {
    margin-top: 8px;
  }
  .tone-switches {
    margin: 8px 0 10px;
    gap: 8px 12px;
  }
  .preview-row {
    font-size: 12px;
  }
  .preview-row button {
    min-height: 30px;
    padding: 4px 10px;
  }
  .ab {
    margin: 8px 0 6px;
  }
  #renderHint {
    margin-bottom: 8px;
  }
  .export-settings {
    margin-top: 8px;
    padding-top: 8px;
  }
  .status-panel {
    padding: 8px 14px;
  }
  .status-panel .note {
    margin-top: 5px;
    font-size: 10px;
  }
}

    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1><span class="app-name">Narration Tempo</span> <span id="appVersion">v0.1.1</span></h1>
          <p data-t="tagline">音量を整え、話す速さを調整</p>
        </div>
        <div class="languages">
          <button id="ja" aria-pressed="true">日本語</button
          ><button id="en" aria-pressed="false">English</button>
        </div>
      </header>
      <div class="intake-row">
        <button id="drop" class="drop">
          <svg
            width="30"
            height="34"
            viewBox="0 0 24 28"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M4 1h10l6 6v20H4zM14 1v7h6M12 22V12m-4 4 4-4 4 4" /></svg
          ><span
            ><strong id="fileName" data-t="choose">音声ファイルを選択</strong
            ><small id="fileInfo" data-t="fileHelp"
              >WAV / MP3 · 入出力は最大72分 · ドロップにも対応</small
            ></span
          >
        </button>
        <section class="status-panel">
          <div class="row">
            <span id="status" role="status" aria-live="polite"></span>
            <button id="cancel" hidden data-t="cancel">中止</button>
            <span id="percent">0%</span>
          </div>
          <progress id="progress" value="0" max="1"></progress>
          <p class="note">
            <span data-t="footer">ローカル処理 · 音声は送信されません。</span>
          </p>
        </section>
      </div>
      <input id="file" type="file" accept=".wav,.wave,.mp3" hidden />
      <section class="wave-panel">
        <div class="row">
          <h2 data-t="whole">音声全体</h2>
          <div class="legend">
            <span data-t="common">共通</span>
            <span class="green" data-t="increase">増加</span>
            <span class="red" data-t="decrease">減少</span>
          </div>
        </div>
        <canvas
          id="wave"
          width="1200"
          height="150"
          tabindex="0"
          role="slider"
          aria-label="プレビュー開始位置"
          aria-valuemin="0"
          aria-valuemax="0"
          aria-valuenow="0"
        ></canvas>
        <div class="row time-axis">
          <span>0:00</span
          ><span id="waveHint" data-t="waveHelp"
            >波形をクリックして試聴位置を選択</span
          ><span id="waveEnd">—</span>
        </div>
        <div class="transport">
          <div class="source-switch" role="group" aria-label="Playback source">
            <button id="original" aria-pressed="true" data-t="source">
              原音
            </button>
            <button id="processed" aria-pressed="false" data-t="result">
              処理後
            </button>
          </div>
          <button id="play" data-t="play">▶ 再生</button>
          <button id="stop" data-t="stop">■ 停止</button>
          <span id="playTime">0:00 / —</span>
          <input
            id="seek"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0"
            aria-label="再生位置"
          />
        </div>
        <audio id="fullPlayer" preload="metadata" hidden></audio>
      </section>
      <div class="columns">
        <section class="settings">
          <h2 data-t="settings">速度と音量</h2>
          <label class="check"
            ><input id="level" type="checkbox" checked /><span data-t="level"
              >レベラー（音量を自動で整える）</span
            ></label
          >
          <div class="tone-switches" role="group" aria-label="Voice correction">
            <label
              ><input id="eqLow" type="checkbox" /><span data-t="eqLow"
                >低音を整理</span
              ></label
            >
            <label
              ><input id="eqMud" type="checkbox" /><span data-t="eqMud"
                >こもりを低減</span
              ></label
            >
            <label
              ><input id="eqClear" type="checkbox" /><span data-t="eqClear"
                >明瞭さを追加</span
              ></label
            >
          </div>
          <div class="row">
            <label for="speed" data-t="speed">速度（話す速さ）</label>
            <div>
              <input
                id="speed"
                type="number"
                min="0.7"
                max="1.3"
                step="0.001"
                value="1.150"
              />
              ×
            </div>
          </div>
          <input
            id="slider"
            type="range"
            min="0.7"
            max="1.3"
            step="0.001"
            value="1.150"
            aria-label="速度倍率"
          />
          <div class="row range-labels">
            <span data-t="slow">0.700（遅く）</span><span>1.000</span
            ><span data-t="fast">1.300（速く）</span>
          </div>
          <div class="row target">
            <label for="minutes" data-t="target">仕上がり時間</label>
            <div class="inline">
              <input
                id="minutes"
                type="number"
                min="0"
                max="72"
                step="1"
                value="0"
              /><span data-t="min">分</span
              ><input
                id="seconds"
                type="number"
                min="0"
                max="59"
                step="1"
                value="0"
              /><span data-t="sec">秒</span
              ><button id="apply" data-t="apply">適用</button>
            </div>
          </div>
          <div class="row durations">
            <span
              ><span data-t="before">元の長さ</span>
              <strong id="before">—</strong></span
            ><span>→</span
            ><span
              ><span data-t="after">仕上がり</span>
              <strong id="after">—</strong></span
            >
          </div>
          <details>
            <summary data-t="advanced">WSOLA詳細設定</summary>
            <div class="ws-grid">
              <label
                >Sequence (ms)<input
                  id="sequenceMs"
                  type="number"
                  min="16"
                  max="120"
                  value="40" /></label
              ><label
                >Seek (ms)<input
                  id="seekMs"
                  type="number"
                  min="2"
                  max="50"
                  value="15" /></label
              ><label
                >Overlap (ms)<input
                  id="overlapMs"
                  type="number"
                  min="2"
                  max="30"
                  value="8"
              /></label>
              <label
                ><span data-t="stride">探索間隔</span
                ><select id="searchStride">
                  <option>1</option>
                  <option>2</option>
                  <option>4</option>
                  <option selected>8</option>
                  <option>16</option>
                </select></label
              ><label
                ><span data-t="step">比較の間引き</span
                ><select id="analysisStep">
                  <option>1</option>
                  <option>2</option>
                  <option>4</option>
                  <option selected>8</option>
                  <option>16</option>
                </select></label
              ><button id="resetWs" data-t="reset">標準に戻す</button>
            </div>
            <p class="note" data-t="wsHelp">
              OverlapはSequenceの半分未満。細かい探索は処理時間が長くなります。
            </p>
          </details>
        </section>
        <section class="output">
          <h2 data-t="listenSave">試聴と保存</h2>
          <button id="render" class="primary" data-t="render">全体変換</button>
          <p id="renderHint" class="note" data-t="renderHelp">
            変換後は上のパネルで自由に試聴できます。
          </p>
          <details id="previewDetails">
            <summary data-t="shortPreview">30秒プレビュー（部分試聴）</summary>
            <div class="row preview-row">
              <label for="start" data-t="start">試聴開始位置</label>
              <div class="inline">
                <input
                  id="start"
                  type="number"
                  min="0"
                  step="0.1"
                  value="0"
                /><span data-t="sec">秒</span
                ><button id="preview" class="accent-outline" data-t="preview">
                  30秒プレビュー
                </button>
              </div>
            </div>
            <div class="ab">
              <button id="a" aria-pressed="true" data-t="a">A 原音</button
              ><button id="b" aria-pressed="false" data-t="b">B 処理後</button>
            </div>
            <audio id="player" controls preload="metadata"></audio>

    $("slider").value = ratio;
    updated();
    syncTimes(true);
  }
  $("speed").oninput = () => {
    locks();
  };
  $("speed").onchange = () => speedChanged($("speed").value);
  $("slider").oninput = () => speedChanged($("slider").value);
  $("apply").onclick = () => {
    if (!meta || busy) return;
    const m = Number($("minutes").value),
      s = Number($("seconds").value);
    if (
      !$("minutes").value ||
      !$("seconds").value ||
      !Number.isInteger(m) ||
      !Number.isInteger(s) ||
      m < 0 ||
      s < 0 ||
      s > 59 ||
      m * 60 + s <= 0
    ) {
      status("invalid", true);
      return;
    }
    const next = meta.length / Math.round((m * 60 + s) * meta.sampleRate);
    if (next < 0.7 - 1e-10 || next > 1.3 + 1e-10) {
      status("invalid", true);
      return;
    }
    ratio = next;
    fromDuration = true;
    $("speed").value = ratio.toFixed(3);
    $("slider").value = ratio;
    updated();
    if (!valid()) status("durationApplied");
  };
  for (const id of ["minutes", "seconds"])
    $(id).onkeydown = (e) => {
      if (e.key === "Enter") $("apply").click();
    };
  for (const id of [
    "level",
    "eqLow",
    "eqMud",
    "eqClear",
    ...Object.keys(wsDefaults),
  ])
    $(id).addEventListener("input", updated);
  function formatHelp() {
    $("formatHelp").textContent = t(
      $("bits").value === "mp3"

        : $("bits").value === "16"
          ? "wav16Help"
          : "wav24Help",
    );
  }
  $("bits").onchange = () => {
    revoke("export");
    $("download").hidden = true;
    formatHelp();
    locks();
  };
  $("resetWs").onclick = () => {
    for (const [k, v] of Object.entries(wsDefaults)) $(k).value = v;
    updated();
  };
  function setStart(v) {
    if (!meta || busy) return;
    $("start").value = Math.max(
      0,
      Math.min(
        Math.max(0, meta.length / meta.sampleRate - 0.1),
        Number(v) || 0,
      ),
    ).toFixed(1);
    clearPreview();
    locks();
    draw();
  }
  $("start").onchange = () => setStart($("start").value);
  // fullPosition is always in original seconds. Switching sources keeps the

  const playbackScale = () => (fullMode === "processed" ? renderRatio : 1);
  function playbackUI() {
    const scale = playbackScale(),
      duration = meta ? meta.length / meta.sampleRate / scale : 0;
    $("play").textContent = t(wantPlay ? "pause" : "play");
    $("playTime").textContent =
      `${time(fullPosition / scale)} / ${meta ? time(duration) : "—"}`;
    $("seek").max = duration || 1;
    $("seek").value = fullPosition / scale;
    $("waveEnd").textContent = meta ? time(duration) : "—";

    $("processed").setAttribute(
      "aria-pressed",
      String(fullMode === "processed"),

  }
  function stopFull(reset = false) {

    $("fullPlayer").pause();
    cancelAnimationFrame(animation);
    if (reset) seekFull(playOrigin);
    playbackUI();
  }
  function tick() {
    if (!wantPlay) return;
    const player = $("fullPlayer");
    if (player.readyState && !player.seeking)

    playbackUI();
    draw();
    animation = requestAnimationFrame(tick);
  }
  async function startFull() {

      cancelAnimationFrame(animation);
      tick();

        stopFull();
        status("playbackError", true);

    playbackUI();
  }
  function selectFull(next) {
    if (!urls[next]) return;
    const playing = wantPlay,
      player = $("fullPlayer"),
      request = ++fullToken;
    stopFull();
    fullMode = next;
    player.src = urls[next];
    player.onloadedmetadata = () => {
      if (request !== fullToken) return;
      player.currentTime = Math.min(
        fullPosition / playbackScale(),
        Math.max(0, player.duration - 0.001),
      );
      if (wantPlay) startFull();
      playbackUI();
      draw();
    };
    player.load();
    wantPlay = playing;
    playbackUI();
    draw();
    locks();
  }
  function seekFull(originalSeconds) {
    if (!meta) return;
    fullPosition = Math.max(
      0,
      Math.min(meta.length / meta.sampleRate, Number(originalSeconds) || 0),
    );
    if ($("fullPlayer").readyState)
      $("fullPlayer").currentTime = fullPosition / playbackScale();
    if (!busy) {
      $("start").value = Math.min(
        fullPosition,
        Math.max(0, meta.length / meta.sampleRate - 0.1),
      ).toFixed(1);
      clearPreview();
    }
    locks();
    playbackUI();
    draw();
  }
  $("original").onclick = () => selectFull("original");
  $("processed").onclick = () => selectFull("processed");
  $("play").onclick = () => {
    if (wantPlay) {
      fullPosition = $("fullPlayer").currentTime * playbackScale();
      stopFull();
      draw();
    } else {
      if (
        $("fullPlayer").ended ||
        fullPosition >= meta.length / meta.sampleRate

        seekFull(0);
      playOrigin = fullPosition;
      startFull();
    }
  };
  $("stop").onclick = () => stopFull(true);
  $("seek").oninput = () => seekFull(Number($("seek").value) * playbackScale());
  $("fullPlayer").onended = () => {
    if (!meta) return;
    fullPosition = meta.length / meta.sampleRate;
    stopFull();
    draw();
  };
  $("fullPlayer").onerror = () => {
    if (urls[fullMode]) {
      stopFull();
      status("playbackError", true);
    }
  };
  $("player").onplay = () => stopFull();
  const waveSeek = (e) => {
    if (!meta) return;
    const rect = $("wave").getBoundingClientRect();
    seekFull(
      (((e.clientX - rect.left) / rect.width) * meta.length) / meta.sampleRate,
    );
  };
  $("wave").onpointerdown = (e) => {
    $("wave").setPointerCapture(e.pointerId);
    waveSeek(e);
  };
  $("wave").onpointermove = (e) => {
    if ($("wave").hasPointerCapture(e.pointerId)) waveSeek(e);
  };
  $("wave").onpointerup = (e) => $("wave").releasePointerCapture(e.pointerId);
  $("wave").onkeydown = (e) => {
    if (!meta) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      seekFull(
        fullPosition + (e.key === "ArrowLeft" ? -5 : 5) * playbackScale(),
      );
    } else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      seekFull(e.key === "Home" ? 0 : meta.length / meta.sampleRate);
    }
  };
  function draw() {
    const canvas = $("wave"),
      ctx = canvas.getContext("2d"),
      w = canvas.width,
      h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#27364a";
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo((i * w) / 10, 0);
      ctx.lineTo((i * w) / 10, h);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.stroke();

        const raw = Math.min(1, rawWave[i]) * h * 0.46,
          result = resultWave ? Math.min(1, resultWave[i]) * h * 0.46 : raw,
          common = Math.min(raw, result),
          outer = Math.max(raw, result),
          x = (i * w) / rawWave.length,
          width = w / rawWave.length;

        String(meta.length / meta.sampleRate / playbackScale()),

  async function parseWav(f) {
    const first = new DataView(await f.slice(0, 12).arrayBuffer());

      String.fromCharCode(...new Uint8Array(v.buffer, v.byteOffset + p, 4));
    if (
      first.byteLength < 12 ||
      four(first, 0) !== "RIFF" ||
      four(first, 8) !== "WAVE"

      throw Error("formatError");

      data = null,
      p = 12;
    const end = Math.min(f.size, first.getUint32(4, true) + 8);
    while (p + 8 <= end) {
      const v = new DataView(await f.slice(p, p + 48).arrayBuffer()),
        id = four(v, 0),
        n = v.getUint32(4, true);
      if (p + 8 + n > end) throw Error("truncated");
      if (id === "fmt ") {
        if (n < 16) throw Error("formatError");
        let code = v.getUint16(8, true);
        if (code === 65534) {
          if (n < 40 || v.getUint16(24, true) < 22) throw Error("formatError");
          const guid = Array.from(new Uint8Array(v.buffer, 32, 16));

            guid.slice(2).join(",") !== "0,0,0,0,16,0,128,0,0,170,0,56,155,113"

            throw Error("formatError");
          code = v.getUint16(32, true);
        }

          format: code,
          channels: v.getUint16(10, true),
          sampleRate: v.getUint32(12, true),
          align: v.getUint16(20, true),
          bits: v.getUint16(22, true),
        };
      }
      if (id === "data" && !data) data = { offset: p + 8, size: n };
      if (format && data) break;
      p += 8 + n + (n % 2);
    }
    if (!format || !data) throw Error("formatError");
    const m = { ...format, ...data };
    if (
      ![1, 3].includes(m.format) ||
      !(m.format === 1 ? [8, 16, 24, 32] : [32, 64]).includes(m.bits) ||
      m.align !== (m.channels * m.bits) / 8 ||
      data.size % m.align
    )
      throw Error("formatError");
    m.length = data.size / m.align;
    return m;
  }
  function checkMeta(m) {

      ![1, 2].includes(m.channels) ||
      m.sampleRate < 8000 ||
      m.sampleRate > 192000 ||
      m.length < 256 ||
      m.length > m.sampleRate * 72 * 60

  async function decodeMp3(f, id) {
    const head = new Uint8Array(await f.slice(0, 256 * 1024).arrayBuffer());

        ((head[6] & 127) << 21) +
        ((head[7] & 127) << 14) +
        ((head[8] & 127) << 7) +
        (head[9] & 127);

      if (head[p] !== 255 || (head[p + 1] & 224) !== 224) continue;
      const ver = (head[p + 1] >> 3) & 3,
        layer = (head[p + 1] >> 1) & 3,
        rate = (head[p + 2] >> 2) & 3,
        br = head[p + 2] >> 4;

    if (f.size > 128 * 1048576) throw Error("mp3Memory");

  function newWorker() {
    const url = URL.createObjectURL(
      new Blob([$("worker-source").textContent], { type: "text/javascript" }),
    );
    const w = new Worker(url);
    URL.revokeObjectURL(url);
    return w;
  }
  async function load(f) {
    if (busy || !f) return;
    const id = ++token;
    stopFull();
    fullToken++;
    $("fullPlayer").removeAttribute("src");
    $("fullPlayer").load();
    revoke("original");
    fullMode = "original";
    fullPosition = playOrigin = 0;
    worker?.terminate();
    worker = null;
    invalidate();
    meta = null;
    file = f;
    rawWave = null;
    draw();
    $("before").textContent =
      $("after").textContent =
      $("waveEnd").textContent =
        "—";
    $("fileName").textContent = f.name;
    $("fileName").title = f.name;
    $("fileInfo").textContent = t("loading");
    setBusy(true);
    status("loading");
    $("progress").value = 0;
    $("percent").textContent = "0%";
    try {
      let decoded;
      if (/\.wav(e)?$/i.test(f.name)) {
        decoded = { meta: await parseWav(f) };

      };

        status("error", true, e.message);
        setBusy(false);
      };

      selectFull("original");
      fileLabel();
      $("start").value = "0";
      $("start").max = Math.max(0, meta.length / meta.sampleRate - 0.1);

        { type: "load", meta, file: decoded.pcm ? null : f, pcm: decoded.pcm },
        decoded.pcm?.map((a) => a.buffer) || [],
      );
    } catch (e) {
      if (id !== token) return;
      meta = null;
      status(
        text[lang][e.message] ? e.message : "error",
        true,
        text[lang][e.message] ? "" : e.message,
      );
      setBusy(false);
    }
  }
  function receive(m) {
    if (m.type === "progress") {
      const phase = {
        analyze: "analyze",
        measure: "measure",
        preview: "previewing",
        export: "exporting",
        render: "rendering",
        mp3: "mp3",
      }[m.phase];
      status(phase);
      $("progress").value = m.value;
      $("percent").textContent = Math.round(m.value * 100) + "%";
      return;
    }
    if (m.type === "loaded") {
      rawWave = m.wave;
      setBusy(false);
      const error = valid();
      status(error || "ready", !!error);
      draw();
      return;
    }
    if (m.type === "error") {
      if (!resultMeta) {
        resultWave = null;
        stats = null;
        metrics();
        draw();
      }
      if (!rawWave) {
        stopFull();
        fullToken++;
        revoke("original");
        $("fullPlayer").removeAttribute("src");
        $("fullPlayer").load();
        meta = null;
        worker?.terminate();
        worker = null;
      }
      status(
        text[lang][m.message] ? m.message : "error",
        m.message !== "cancelled",
        text[lang][m.message] ? "" : m.message,
      );
      setBusy(false);
      return;
    }
    if (m.type === "previewed") {
      urls.a = URL.createObjectURL(m.a);
      urls.b = URL.createObjectURL(m.b);
      previewReference = m.reference;
      previewInfo();
      selectAB("b", false);
      status("previewed");
    }
    if (m.type === "rendered") {
      stats = m.stats;
      resultWave = Float32Array.from(
        stats.wave,
        (v) => v * 10 ** (stats.gainDb / 20),
      );

      urls.processed = URL.createObjectURL(m.blob);
      resultMeta = m.meta;
      renderRatio = ratio;
      selectFull("processed");
      status("rendered");

      revoke("export");
      urls.export = URL.createObjectURL(m.blob);

      link.download = outputName();
      link.hidden = false;
      link.click();
      status("exported");
    }
    $("progress").value = 1;
    $("percent").textContent = "100%";
    setBusy(false);
  }
  function outputName() {
    const stem = file.name
        .replace(/\.[^.]+$/, "")
        .replace(/[\\/:*?"<>|]/g, "_"),
      c = config();
    const speed = fromDuration
      ? "to" +
        time(Math.round(meta.length / ratio) / meta.sampleRate).replace(
          ":",
          "m",
        ) +
        "s"
      : "x" + ratio.toFixed(3);
    const ws = Object.keys(wsDefaults).some((k) => c.ws[k] !== wsDefaults[k])
      ? `_ws${c.ws.sequenceMs}-${c.ws.seekMs}-${c.ws.overlapMs}_s${c.ws.searchStride}d${c.ws.analysisStep}`

  function process(type) {
    if (busy || !meta || !worker) return;

    if (error) {
      status(error, true);
      return;
    }
    if (type === "preview") clearPreview();
    else {
      revoke("export");
      $("download").hidden = true;
    }
    if (type === "export" && !resultMeta) {
      status("notRendered", true);
      return;

      $("previewDetails").open = false;
    }

    $("player").pause();
    stopFull();
    $("progress").value = 0;
    $("percent").textContent = "0%";
    status(
      type === "export"
        ? config().bits === "mp3"
          ? "mp3"
          : "exporting"
        : type === "preview"
          ? "previewing"
          : "measure",
    );

      type,
      config: config(),
      start: Number($("start").value) || 0,
    });
  }
  $("preview").onclick = () => process("preview");
  $("render").onclick = () => process("render");
  $("export").onclick = () => process("export");
  $("cancel").onclick = () => {
    if (worker) worker.postMessage({ type: "cancel" });
    else {
      token++;
      meta = null;
      status("cancelled");
      setBusy(false);
    }
  };
  function selectAB(next, keep = true) {
    if (!urls[next]) return;

      playing = !player.paused,
      point = (player.currentTime || 0) * (mode === "b" ? ratio : 1),
      target = next === "b" ? point / ratio : point;

    player.src = urls[next];

      if (request !== abToken) return;

  $("b").onclick = () => selectAB("b");

    load($("file").files[0]);
    $("file").value = "";
  };

    e.preventDefault();
    if (!busy) $("drop").classList.add("drag");
  };

    e.preventDefault();

  window.addEventListener("drop", (e) => e.preventDefault());

    worker?.terminate();

  locks();

})();
